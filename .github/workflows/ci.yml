name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root-directory: ["lab_1"]
    defaults:
      run:
        working-directory: ${{ matrix.root-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src

      - name: Format check (ruff format)
        run: uv run ruff format --check src

      - name: Type check (mypy)
        run: uv run mypy --strict src

      - name: Tests (pytest)
        run: uv run pytest
